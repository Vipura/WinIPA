name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build Windows Installer & Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install npm dependencies
        run: npm ci

      - name: Verify Quality Gates (Frontend & Backend)
        run: |
          npm run typecheck
          npm run lint
          cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri Windows Bundles (MSI & NSIS EXE)
        run: npm run tauri build

      - name: Prepare Release Artifacts & Generate Checksums
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release-artifacts

          # Copy NSIS installer (.exe)
          $nsisInstallers = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis/*.exe" -ErrorAction SilentlyContinue
          foreach ($file in $nsisInstallers) {
            Write-Host "Found NSIS installer: $($file.FullName)"
            Copy-Item -Path $file.FullName -Destination "release-artifacts/$($file.Name)"
          }

          # Copy WiX / MSI installer (.msi)
          $msiInstallers = Get-ChildItem -Path "src-tauri/target/release/bundle/msi/*.msi" -ErrorAction SilentlyContinue
          foreach ($file in $msiInstallers) {
            Write-Host "Found MSI installer: $($file.FullName)"
            Copy-Item -Path $file.FullName -Destination "release-artifacts/$($file.Name)"
          }

          # Compute SHA-256 Checksums
          $artifacts = Get-ChildItem -Path "release-artifacts/*" -File
          $hashes = foreach ($item in $artifacts) {
            $hash = (Get-FileHash -Path $item.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($item.Name)"
          }
          $hashes | Out-File -FilePath "release-artifacts/SHA256SUMS.txt" -Encoding utf8

          Write-Host "Generated SHA256SUMS.txt:"
          Get-Content "release-artifacts/SHA256SUMS.txt"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "WinIPA ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
