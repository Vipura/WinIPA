[package]
name = "winipa"
version = "0.1.14"
description = "Test iOS apps on iPhone from Windows without a Mac"
authors = ["WinIPA Contributors"]
edition = "2021"
license = "GPL-3.0-only"

[lib]
name = "winipa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.43", features = ["sync", "time", "rt-multi-thread", "net", "io-util", "process"] }
plist = "1.7"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
keyring = "3.6"
uuid = { version = "1.13", features = ["v4"] }
regex = "1.11"
tempfile = "3.17"
winreg = "0.56"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls", "cookies", "gzip"] }
rsa = { version = "0.9", features = ["pem"] }
rand = "0.8"
sha2 = { version = "0.10", features = ["oid"] }
async-trait = "0.1"
rfd = "0.15"
flate2 = "1.1.11"
crc32fast = "1.5.5"
num-bigint = "0.5.1"
pbkdf2 = "0.12"
hmac = "0.12"
base64 = "0.23.1"
hex = "0.4.3"

[dev-dependencies]
tokio = { version = "1.43", features = ["full"] }
rcgen = "0.14"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
